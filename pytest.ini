[pytest]
testpaths =
    tests
    src/prognostic_engine/tests
addopts =
    --ignore=tests/test_integration.py
    --ignore=tests/test_models.py
    --ignore=tests/test_model_comparisons_v2.py
    --ignore=tests/test_quick.py

# The ignored root-level tests are retained as historical prototypes.  They
# depend on retired interfaces and files deliberately excluded from this
# public, data-free repository.  The maintained test suites are listed above.
