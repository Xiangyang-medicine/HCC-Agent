[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prognostic-engine"
version = "0.1.0"
description = "Formal nested CV survival model training for Phase 3A"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "xlrd>=2.0.1",
    "pyarrow>=14.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "lifelines>=0.29",
    "scikit-survival>=0.28",
    "torch>=2.0",
    "pycox>=0.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "openai>=1.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]
